<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anu Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#251d18;font:15px Arial}.bar{background:#251d18;color:#fff;padding:17px max(20px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.bar h1,h2,h3{font-family:Georgia;font-weight:400}.bar h1{margin:0;font-size:25px}.bar small{opacity:.75}main{max-width:1100px;margin:25px auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:center}.top h2{font-size:30px}button{background:#251d18;color:#fff;border:0;border-radius:4px;padding:10px 14px;cursor:pointer;font-weight:bold}.alt{background:#e7ddd0;color:#251d18}.red{background:#8a2525}.ship{background:#b06a24}.notice{min-height:22px;color:#80531d}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{background:#fff;border:1px solid #e1d7cb}.card img{width:100%;height:180px;object-fit:cover;background:#ddd}.card div{padding:12px}.card h3{font-size:20px;margin:0 0 5px}.card p{font-size:13px;color:#705f54}.actions{display:flex;gap:6px}.actions button{font-size:12px;padding:7px 9px}dialog{border:0;width:min(760px,95vw);max-height:94vh;padding:0;box-shadow:0 12px 55px #0008}.form{padding:24px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{font-size:11px;text-transform:uppercase;font-weight:bold;letter-spacing:.08em}input,select,textarea{width:100%;display:block;margin-top:5px;padding:9px;border:1px solid #cfc2b3;font:15px Arial}textarea{height:75px}.row{margin-top:18px;display:flex;justify-content:flex-end;gap:10px}@media(max-width:600px){.fields{grid-template-columns:1fr}.bar small{display:none}}</style><header class="bar"><div><h1>Anu Kalakriti Studio</h1><small>Changes stay local until you press Ship.</small></div><button class="ship" onclick="ship()">Ship to website</button></header><main><div class="top"><h2>Artwork collection</h2><button onclick="newArt()">+ Add artwork</button></div><p class="notice" id="notice"></p><section class="grid" id="grid"></section></main><dialog id="modal"><form class="form" onsubmit="save(event)"><h2 id="heading">Artwork</h2><div class="fields"><label>Title<input id="title" required></label><label>Category<select id="category"><option>madhubani</option><option>mithila</option><option>godna</option><option>folk-contemporary</option></select></label><label>Price (INR)<input id="price" type="number"></label><label>Year<input id="year" type="number"></label><label>Medium<input id="medium"></label><label>Size<input id="size"></label><label>Availability<select id="availability"><option>available</option><option>reserved</option><option>sold</option></select></label><label>Gallery position<input id="order" type="number"></label><label class="wide">Image URL<input id="image_url" required></label><label class="wide">Or upload image<input id="upload" type="file" accept="image/*"></label><label class="wide">Description<textarea id="description"></textarea></label><label class="wide">Story<textarea id="story"></textarea></label><label><input id="featured" type="checkbox" style="width:auto;display:inline"> Featured on home</label><label><input id="certificate" type="checkbox" style="width:auto;display:inline"> Certificate included</label></div><div class="row"><button type="button" class="alt" onclick="modal.close()">Cancel</button><button>Save draft</button></div></form></dialog><script>let list=[],edit;const $=x=>document.getElementById(x),note=x=>$("notice").textContent=x;async function load(){list=await fetch('/api/artworks').then(x=>x.json());render()}function render(){grid.innerHTML='';list.sort((a,b)=>a.order-b.order).forEach(a=>{let e=document.createElement('article');e.className='card';e.innerHTML=`<img src="${a.image_url}"><div><h3>${a.title}</h3><p>${a.category} · ${a.availability} · #${a.order}</p><span class="actions"><button class="alt">Edit</button><button class="alt">↑</button><button class="alt">↓</button><button class="red">Delete</button></span></div>`;let b=e.querySelectorAll('button');b[0].onclick=()=>open(a);b[1].onclick=()=>move(a,-1);b[2].onclick=()=>move(a,1);b[3].onclick=()=>del(a);grid.append(e)})}function newArt(){edit={id:crypto.randomUUID(),title:'',category:'madhubani',price:0,year:new Date().getFullYear(),medium:'Natural pigments on handmade paper',size:'',availability:'available',description:'',story:'',image_url:'',additional_images:[],featured:false,certificate:true,order:list.length+1,currency:'INR',created_at:new Date().toISOString()};open()}function open(a){if(a)edit=structuredClone(a);heading.textContent=edit.title?'Edit artwork':'Add artwork';for(let k of ['title','category','price','year','medium','size','availability','order','image_url','description','story'])$(k).value=edit[k]??'';featured.checked=!!edit.featured;certificate.checked=!!edit.certificate;upload.value='';modal.showModal()}async function save(e){e.preventDefault();for(let k of ['title','category','price','year','medium','size','availability','order','image_url','description','story'])edit[k]=$(k).value;edit.price=+edit.price;edit.year=+edit.year;edit.order=+edit.order;edit.featured=featured.checked;edit.certificate=certificate.checked;edit.slug=edit.slug||edit.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+'-'+edit.id.slice(0,5);let f=upload.files[0];if(f){note('Uploading…');let r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':f.type,'X-File-Name':f.name},body:f}),d=await r.json();if(!r.ok)return note(d.message);edit.image_url=d.url}let i=list.findIndex(x=>x.id===edit.id);i<0?list.push(edit):list[i]=edit;await persist('Draft saved locally. Press Ship when ready.');modal.close()}async function persist(m){list.sort((a,b)=>a.order-b.order).forEach((a,i)=>a.order=i+1);await fetch('/api/artworks',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(list)});note(m);render()}async function move(a,d){let i=list.indexOf(a),j=i+d;if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];await persist('Position saved locally. Press Ship when ready.')}async function del(a){if(confirm('Delete '+a.title+'?')){list=list.filter(x=>x.id!==a.id);await persist('Artwork deleted locally. Press Ship when ready.')}}async function ship(){if(!confirm('Push saved changes to GitHub and deploy Vercel?'))return;note('Shipping…');let d=await fetch('/api/ship',{method:'POST'}).then(x=>x.json());note(d.message+(d.detail?' '+d.detail:''))}load()</script>
